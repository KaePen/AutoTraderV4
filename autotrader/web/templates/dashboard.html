{% extends "base.html" %}

{% block content %}
<div class="space-y-4">
  <!-- メトリクスストリップ -->
  <div id="metrics-strip" class="grid grid-cols-2 md:grid-cols-5 gap-3">
    <!-- スケルトン -->
    <div class="card skeleton-card animate-pulse"><div class="h-3 skeleton w-16 mb-2"></div><div class="h-6 skeleton w-24"></div></div>
    <div class="card skeleton-card animate-pulse"><div class="h-3 skeleton w-16 mb-2"></div><div class="h-6 skeleton w-24"></div></div>
    <div class="card skeleton-card animate-pulse"><div class="h-3 skeleton w-16 mb-2"></div><div class="h-6 skeleton w-24"></div></div>
    <div class="card skeleton-card animate-pulse"><div class="h-3 skeleton w-16 mb-2"></div><div class="h-6 skeleton w-24"></div></div>
    <div class="card skeleton-card animate-pulse"><div class="h-3 skeleton w-16 mb-2"></div><div class="h-6 skeleton w-24"></div></div>
  </div>

  <!-- ライブアナリティクス（全幅） -->
  <div id="analysis-panel" class="card border border-gray-700 hidden">
    <div class="flex items-center gap-2 mb-3">
      <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Live Analysis</h3>
      <span id="ap-direction-badge" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-gray-700 text-gray-400">--</span>
      <span id="ap-score-text" class="text-[11px] tabular-nums text-gray-300 font-medium">-- / --</span>
    </div>
    <!-- スコアバー（中央0基準・左SELL/右BUY） -->
    <div class="mb-3">
      <!-- SELL/BUYラベル -->
      <div class="flex items-center justify-between text-[9px] text-gray-600 mb-0.5">
        <span>SELL</span>
        <span>BUY</span>
      </div>
      <div class="w-full h-3 bg-gray-700 rounded-full overflow-hidden relative">
        <!-- 中央から左右に伸びるバー -->
        <div id="ap-score-bar" class="absolute top-0 h-full rounded-full transition-all duration-500 bg-gray-500" style="left:50%;width:0%"></div>
        <!-- 中央線（0基準） -->
        <div class="absolute top-0 left-1/2 w-px h-full bg-gray-400/60"></div>
        <!-- 閾値マーカー（左右対称） -->
        <div id="ap-threshold-sell" class="absolute top-0 w-0.5 h-full bg-yellow-400/70" style="left:30%"></div>
        <div id="ap-threshold-buy" class="absolute top-0 w-0.5 h-full bg-yellow-400/70" style="left:70%"></div>
      </div>
    </div>
    <!-- サブ指標 -->
    <div class="grid grid-cols-3 gap-2 mb-3 text-xs">
      <div class="bg-gray-800/50 rounded p-2">
        <p class="text-gray-500 mb-0.5">HTF整合</p>
        <p id="ap-htf" class="font-bold tabular-nums text-gray-300">--</p>
      </div>
      <div class="bg-gray-800/50 rounded p-2">
        <p class="text-gray-500 mb-0.5">トレンド強度</p>
        <p id="ap-trend" class="font-bold tabular-nums text-gray-300">--</p>
      </div>
      <div class="bg-gray-800/50 rounded p-2">
        <p class="text-gray-500 mb-0.5">ペナルティ</p>
        <p id="ap-penalty" class="font-bold tabular-nums text-gray-300">--</p>
      </div>
    </div>
    <!-- 時間足スコア -->
    <div id="ap-tf-scores" class="w-full"></div>
  </div>

  <!-- ポジションパネル（全幅） -->
  <div class="card" id="position-panel">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Positions</h2>
      <span id="position-count" class="text-xs text-gray-500">no open</span>
    </div>
    <div id="position-list" class="overflow-y-auto max-h-80" data-wide="true">
      <div class="flex items-center justify-center h-16 text-gray-500 text-sm">ポジションなし</div>
    </div>
  </div>

  <!-- トレード履歴(2/3) + インジケータ(1/3) -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-stretch">
    <!-- 左: トレード履歴 -->
    <div class="lg:col-span-2" id="trade-history-panel">
      <div class="card h-full flex flex-col">
        <div class="flex items-center justify-between mb-2">
          <button id="trade-history-toggle" class="flex items-center gap-2 text-sm font-semibold text-gray-300 uppercase tracking-wider hover:text-white transition-colors">
            <svg id="trade-history-chevron" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
            Trade History
          </button>
        </div>
        <div id="trade-history-table" class="overflow-x-auto max-h-80 flex-1"></div>
      </div>
    </div>
    <!-- 右: インジケータ -->
    <div class="card flex flex-col" id="indicator-panel">
      <div class="flex items-center justify-between mb-3 flex-shrink-0">
        <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Indicators</h2>
        <div id="indicator-tf-tabs" class="flex gap-1"></div>
      </div>
      <div id="indicator-grid" class="grid grid-cols-2 gap-3 overflow-y-auto flex-1 min-h-0">
        <!-- 動的に描画 -->
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/dashboard.js?v=10"></script>
{% endblock %}
