{% extends "base.html" %}

{% block content %}
<!-- 自然なページフロー。ビューポートフィット廃止でスクロール可能 -->
<div class="flex flex-col gap-4">
  <!-- メトリクスストリップ -->
  <div id="metrics-strip" class="flex-shrink-0 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-1.5">
    <!-- スケルトン -->
    <div class="card skeleton-card animate-pulse"><div class="h-3 skeleton w-16 mb-2"></div><div class="h-6 skeleton w-24"></div></div>
    <div class="card skeleton-card animate-pulse"><div class="h-3 skeleton w-16 mb-2"></div><div class="h-6 skeleton w-24"></div></div>
    <div class="card skeleton-card animate-pulse"><div class="h-3 skeleton w-16 mb-2"></div><div class="h-6 skeleton w-24"></div></div>
    <div class="card skeleton-card animate-pulse"><div class="h-3 skeleton w-16 mb-2"></div><div class="h-6 skeleton w-24"></div></div>
    <div class="card skeleton-card animate-pulse"><div class="h-3 skeleton w-16 mb-2"></div><div class="h-6 skeleton w-24"></div></div>
  </div>

  <!-- チャート + ポジション グリッド -->
  <!-- 左カラム(2/3): [分析パネル(live時)] + [チャート] を縦積み -->
  <!-- 右カラム(1/3): Positionsパネルがグリッドのストレッチで左カラムと同じ高さを占有 -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- 左カラム (2/3幅): 分析パネル + チャート -->
    <div class="lg:col-span-2 flex flex-col gap-4">
      <!-- 分析パネル (ライブ時のみ表示) -->
      <div id="analysis-panel" class="flex-shrink-0 card border border-gray-700 hidden">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Live Analysis</h2>
          <span id="ap-direction-badge" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-gray-700 text-gray-400">--</span>
          <span id="ap-score-text" class="text-[11px] tabular-nums text-gray-300 font-medium">-- / --</span>
          <span id="ap-next-event" class="hidden ml-auto inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-red-900/40 border border-red-700/50 text-[11px] text-red-300">
            <span class="w-1.5 h-1.5 rounded-full bg-red-400 animate-pulse flex-shrink-0"></span>
            <span id="ap-next-event-text">--</span>
          </span>
        </div>
        <!-- スコアバー（中央0基準・左SELL/右BUY） -->
        <div class="mb-3">
          <!-- SELL/BUYラベル -->
          <div class="flex items-center justify-between text-[9px] text-gray-600 mb-0.5">
            <span>SELL</span>
            <span>BUY</span>
          </div>
          <div class="w-full h-3 bg-gray-700 rounded-full overflow-hidden relative">
            <!-- 中央から左右に伸びるバー -->
            <div id="ap-score-bar" class="absolute top-0 h-full rounded-full transition-all duration-500 bg-gray-500" style="left:50%;width:0%"></div>
            <!-- 中央線（0基準） -->
            <div class="absolute top-0 left-1/2 w-px h-full bg-gray-400/60"></div>
            <!-- 閾値マーカー（左右対称） -->
            <div id="ap-threshold-sell" class="absolute top-0 w-0.5 h-full bg-yellow-400/70" style="left:30%"></div>
            <div id="ap-threshold-buy" class="absolute top-0 w-0.5 h-full bg-yellow-400/70" style="left:70%"></div>
          </div>
        </div>
        <!-- サブ指標 -->
        <div class="grid grid-cols-3 gap-2 mb-3 text-xs">
          <div class="bg-gray-800/50 rounded p-2">
            <p class="text-gray-500 mb-0.5">HTF整合</p>
            <p id="ap-htf" class="font-bold tabular-nums text-gray-300">--</p>
          </div>
          <div class="bg-gray-800/50 rounded p-2">
            <p class="text-gray-500 mb-0.5">トレンド強度</p>
            <p id="ap-trend" class="font-bold tabular-nums text-gray-300">--</p>
          </div>
          <div class="bg-gray-800/50 rounded p-2">
            <p class="text-gray-500 mb-0.5">ペナルティ</p>
            <p id="ap-penalty" class="font-bold tabular-nums text-gray-300">--</p>
          </div>
        </div>
        <!-- 時間足スコア -->
        <div id="ap-tf-scores" class="w-full"></div>
      </div>

      <!-- チャートカード -->
      <div class="card flex flex-col">
        <div class="flex items-center justify-between mb-3 flex-shrink-0">
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Chart</h2>
            <span id="chart-title" class="text-[11px] text-gray-500 font-medium">USDJPY</span>
          </div>
          <!-- 時間足ボタン -->
          <div id="chart-timeframe-buttons" class="flex gap-1"></div>
        </div>
        <!-- OHLC情報バー（クロスヘア連動） -->
        <div id="chart-ohlc-bar" class="flex items-center gap-3 px-1 pb-1 text-xs tabular-nums invisible flex-shrink-0">
          <span class="text-gray-500">O:<span id="chart-ohlc-o" class="text-gray-300 ml-0.5">-</span></span>
          <span class="text-gray-500">H:<span id="chart-ohlc-h" class="text-green-400 ml-0.5">-</span></span>
          <span class="text-gray-500">L:<span id="chart-ohlc-l" class="text-red-400 ml-0.5">-</span></span>
          <span class="text-gray-500">C:<span id="chart-ohlc-c" class="ml-0.5">-</span></span>
          <span id="chart-ohlc-chg" class="font-medium">-</span>
          <span class="text-gray-600">|</span>
          <span class="text-gray-500">Vol:<span id="chart-ohlc-vol" class="text-gray-400 ml-0.5">-</span></span>
        </div>
        <!-- メインチャート: 全ブレークポイントで固定高さ -->
        <div id="chart-container" class="h-[216px] sm:h-[270px] md:h-[324px] lg:h-[378px] w-full relative">
          <div id="chart-loader" class="absolute inset-0 flex items-center justify-center bg-gray-800/50 z-10">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ポジションパネル (右1/3) -->
    <!-- グリッドのストレッチで左カラムと同じ高さを自動で占有 -->
    <!-- mobile: min-h-[160px]で最低高さを確保しコンテンツが見える -->
    <div class="card flex flex-col overflow-hidden min-h-[160px]" id="position-panel">
      <div class="flex items-center justify-between mb-3 flex-shrink-0">
        <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Positions</h2>
        <span id="position-count" class="text-xs text-gray-500">no open</span>
      </div>
      <div id="position-list" class="overflow-y-auto flex-1 min-h-0">
        <div class="flex items-center justify-center h-16 text-gray-500 text-sm">ポジションなし</div>
      </div>
    </div>
  </div>

  <!-- ファンダメンタルパネル（ニュース + カレンダー 2カラム） -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <!-- ニュースウィジェット -->
    <div class="card flex flex-col" id="fundamental-news-card">
      <div class="flex items-center justify-between mb-3 flex-shrink-0">
        <div class="flex items-center gap-2">
          <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">News</h2>
          <span id="fundamental-news-count" class="text-xs text-gray-500">--</span>
        </div>
        <span id="fundamental-news-updated" class="text-[10px] text-gray-600 tabular-nums"></span>
      </div>
      <div id="fundamental-news-list" class="overflow-y-auto flex-1 min-h-0 max-h-64 space-y-2">
      </div>
    </div>
    <!-- 経済カレンダーウィジェット -->
    <div class="card flex flex-col" id="fundamental-calendar-card">
      <div class="flex items-center justify-between mb-3 flex-shrink-0">
        <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Economic Calendar</h2>
        <span id="fundamental-calendar-updated" class="text-[10px] text-gray-600 tabular-nums"></span>
      </div>
      <div id="fundamental-calendar-list" class="overflow-y-auto flex-1 min-h-0 max-h-64">
      </div>
    </div>
  </div>

  <!-- Row 3: トレード履歴（全幅）-->
  <!-- mobile: max-h-96でテーブル内スクロール / lg+: max-h-[25vh]でビューポート比に制限 -->
  <div id="trade-history-panel" class="flex-shrink-0">
    <div class="card flex flex-col">
      <div class="flex items-center justify-between mb-3 flex-shrink-0">
        <button id="trade-history-toggle" class="flex items-center gap-2 text-sm font-semibold text-gray-300 uppercase tracking-wider hover:text-white transition-colors">
          <svg id="trade-history-chevron" class="w-3.5 h-3.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
          Trade History
        </button>
        <div id="trade-filter-bar"></div>
      </div>
      <div id="trade-history-table" class="overflow-x-auto overflow-y-auto max-h-96 lg:max-h-[25vh]"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/chart.js?v=8"></script>
<script src="/static/js/fundamental.js?v=3"></script>
<script src="/static/js/dashboard.js?v=34"></script>
{% endblock %}
