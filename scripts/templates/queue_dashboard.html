<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バックテストキューランナー</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
  .mono { font-family: 'Cascadia Code', 'Consolas', monospace; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
  .btn { transition: all 0.15s; }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: scale(0.97); }
  .profit { color: #4ade80; }
  .loss { color: #f87171; }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .fade-in { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #1e293b; }
  ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-6xl mx-auto px-4 py-6">

  <!-- ヘッダー -->
  <div class="card px-6 py-4 mb-4">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-white">バックテストキューランナー</h1>
        <div class="flex items-center gap-4 mt-1 text-sm">
          <span id="runner-status" class="text-slate-400">接続中...</span>
          <span id="cpu-usage" class="mono text-slate-400"></span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1 mr-2">
          <label class="text-xs text-slate-400">CPU:</label>
          <input id="cpu-input" type="number" min="1" max="32" value="12"
            class="w-14 px-2 py-1.5 bg-slate-800 border border-slate-600 rounded text-sm mono text-white text-center">
          <button onclick="changeCpu()"
            class="btn px-3 py-1.5 bg-slate-600 text-white rounded text-sm">変更</button>
        </div>
        <button onclick="sendCmd('pause')"
          class="btn px-4 py-2 bg-yellow-600 text-white rounded-lg text-sm font-medium">
          一時停止
        </button>
        <button onclick="sendCmd('resume')"
          class="btn px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium">
          再開
        </button>
        <button onclick="if(confirm('全タスクを停止しますか？')) sendCmd('stop')"
          class="btn px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium">
          全停止
        </button>
      </div>
    </div>
  </div>

  <!-- 実行中ジョブ（月タスク表示） -->
  <div class="mb-4">
    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2 px-1">
      実行中ジョブ
    </h2>
    <div id="running-jobs" class="space-y-3">
      <div class="card px-5 py-4 text-slate-500 text-sm">ジョブなし</div>
    </div>
  </div>

  <!-- 完了済みジョブ -->
  <div class="mb-4">
    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2 px-1">
      完了済みジョブ
    </h2>
    <div id="completed-jobs">
      <div class="card px-5 py-4 text-slate-500 text-sm">結果なし</div>
    </div>
  </div>

  <!-- キュー -->
  <div class="mb-4">
    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2 px-1">
      キュー
    </h2>
    <div id="queue-list">
      <div class="card px-5 py-4 text-slate-500 text-sm">キューなし</div>
    </div>
  </div>

</div>

<script>
const API = '';
let lastStatus = null;
let lastResults = null;

// 展開中の詳細行IDを保持（ポーリング再描画でも維持）
const expandedDetails = new Set();
// 前回描画データのハッシュ（変更がなければ再描画スキップ）
let lastResultsHash = '';

// ===================================================================
// ユーティリティ
// ===================================================================

function fmtNum(n, decimals=0) {
  if (n == null) return '-';
  return Number(n).toLocaleString('ja-JP', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function fmtPct(n, decimals=1) {
  if (n == null) return '-';
  return Number(n).toFixed(decimals) + '%';
}

function fmtProfit(n) {
  if (n == null) return '-';
  const cls = n >= 0 ? 'profit' : 'loss';
  const sign = n >= 0 ? '+' : '';
  return `<span class="${cls} mono">${sign}${fmtNum(n)}</span>`;
}

function fmtEquity(n) {
  if (n == null) return '-';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return fmtNum(n);
}

function fmtProfitK(n) {
  if (n == null) return '-';
  const cls = n >= 0 ? 'profit' : 'loss';
  const sign = n >= 0 ? '+' : '';
  const v = Math.abs(n) >= 1e6
    ? (n / 1e6).toFixed(2) + 'M'
    : Math.abs(n) >= 1e3
      ? (n / 1e3).toFixed(0) + 'K'
      : fmtNum(n);
  return `<span class="${cls} mono">${sign}${v}</span>`;
}

function fmtElapsed(seconds) {
  if (!seconds) return '-';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  if (h > 0) return `${h}h ${m}m ${s}s`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function fmtLiveElapsed(startedAt) {
  if (!startedAt) return '-';
  const start = new Date(startedAt).getTime();
  const now = Date.now();
  const diff = Math.max(0, (now - start) / 1000);
  return fmtElapsed(diff);
}

// ===================================================================
// コマンド送信
// ===================================================================

async function sendCmd(cmd) {
  try {
    const res = await fetch(API + '/api/command', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command: cmd})
    });
    const data = await res.json();
    if (!res.ok) {
      alert('エラー: ' + (data.error || 'unknown'));
    }
  } catch(e) {
    alert('通信エラー: ' + e.message);
  }
}

function changeCpu() {
  const v = document.getElementById('cpu-input').value;
  const n = parseInt(v, 10);
  if (isNaN(n) || n < 1) { alert('1以上の数値を入力してください'); return; }
  sendCmd('cpu ' + n);
}

// ===================================================================
// 表示更新（月スケジューラ対応）
// ===================================================================

function _createJobCard(jp) {
  // jp = job_progress エントリ
  const id = jp.result_id || jp.job_id || '-';
  const typeLabel = jp.type === 'multi_pair' ? 'マルチペア' : 'シングル';

  const card = document.createElement('div');
  card.className = 'card px-5 py-4 fade-in';
  card.dataset.jobId = id;
  card.innerHTML = `
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-3">
        <span class="pulse inline-block w-2 h-2 bg-green-400 rounded-full"></span>
        <span class="font-semibold text-white">${id}</span>
        <span class="text-xs px-2 py-0.5 bg-blue-900 text-blue-300 rounded">${typeLabel}</span>
      </div>
      <span class="mono text-sm text-slate-400" data-field="elapsed"></span>
    </div>
    <div class="mt-2 mb-2">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs text-slate-400" data-field="progress-label">待機中...</span>
      </div>
      <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
        <div data-field="progress-bar"
          class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full transition-all duration-500"
          style="width: 0%"></div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-4 text-sm text-slate-300">
      <div>
        <span class="text-slate-500">シンボル:</span>
        <span class="mono">${jp.symbol || '-'}</span>
      </div>
      <div>
        <span class="text-slate-500">期間:</span>
        <span class="mono">${jp.years || '-'}</span>
      </div>
      <div>
        <span class="text-slate-500">進捗:</span>
        <span class="mono" data-field="month-count">${jp.completed || 0}/${jp.total || 0}月</span>
      </div>
    </div>
    <div class="mt-2" data-field="running-months"></div>
    ${jp.description ? `<div class="mt-2 text-xs text-slate-500">${jp.description}</div>` : ''}
  `;
  return card;
}

function _updateJobCard(card, jp, runningTasks) {
  const elapsedEl = card.querySelector('[data-field="elapsed"]');
  if (elapsedEl) elapsedEl.textContent = fmtLiveElapsed(jp.started_at);

  // プログレスバー更新
  const pct = Math.min(100, Math.round(jp.pct || 0));
  const barEl = card.querySelector('[data-field="progress-bar"]');
  if (barEl) barEl.style.width = pct + '%';

  const labelEl = card.querySelector('[data-field="progress-label"]');
  if (labelEl) {
    if (pct > 0) {
      labelEl.textContent = `${jp.completed}/${jp.total}月 (${pct}%)`;
      labelEl.className = 'text-xs mono text-cyan-400';
    } else {
      labelEl.textContent = 'データ準備中...';
      labelEl.className = 'text-xs text-slate-400';
    }
  }

  const countEl = card.querySelector('[data-field="month-count"]');
  if (countEl) countEl.textContent = `${jp.completed || 0}/${jp.total || 0}月`;

  // 実行中月タスク表示
  const monthsEl = card.querySelector('[data-field="running-months"]');
  if (monthsEl && runningTasks) {
    const jobTasks = runningTasks.filter(t => t.result_id === jp.result_id);
    if (jobTasks.length > 0) {
      monthsEl.innerHTML = `
        <div class="flex flex-wrap gap-1">
          ${jobTasks.map(t => `
            <span class="text-xs px-2 py-0.5 bg-cyan-900/50 text-cyan-300 rounded mono">
              ${t.year}/${String(t.month).padStart(2, '0')}
            </span>
          `).join('')}
        </div>
      `;
    } else {
      monthsEl.innerHTML = '';
    }
  }
}

function renderRunningJobs(status) {
  const el = document.getElementById('running-jobs');
  const jobProgress = status?.job_progress || [];
  const runningTasks = status?.running_tasks || [];

  // in_progressのジョブのみ
  const active = jobProgress.filter(jp => jp.status === 'in_progress');

  if (active.length === 0 && runningTasks.length === 0) {
    if (!el.querySelector('.empty-msg')) {
      el.innerHTML = '<div class="card px-5 py-4 text-slate-500 text-sm empty-msg">ジョブなし</div>';
    }
    return;
  }

  const emptyMsg = el.querySelector('.empty-msg');
  if (emptyMsg) emptyMsg.remove();

  const currentIds = new Set(active.map(jp => jp.result_id || jp.job_id || '-'));

  // 不要なカード削除
  el.querySelectorAll('[data-job-id]').forEach(card => {
    if (!currentIds.has(card.dataset.jobId)) card.remove();
  });

  // 更新 or 追加
  active.forEach(jp => {
    const id = jp.result_id || jp.job_id || '-';
    let card = el.querySelector(`[data-job-id="${id}"]`);
    if (card) {
      _updateJobCard(card, jp, runningTasks);
    } else {
      card = _createJobCard(jp);
      _updateJobCard(card, jp, runningTasks);
      el.appendChild(card);
    }
  });
}

function renderCompletedJobs(results) {
  const el = document.getElementById('completed-jobs');
  if (!results || results.length === 0) {
    el.innerHTML = '<div class="card px-5 py-4 text-slate-500 text-sm">結果なし</div>';
    lastResultsHash = '';
    return;
  }

  const completed = results.filter(r => r.status === 'completed' || r.status === 'failed' || r.status === 'cancelled');
  if (completed.length === 0) {
    el.innerHTML = '<div class="card px-5 py-4 text-slate-500 text-sm">結果なし</div>';
    lastResultsHash = '';
    return;
  }

  // データ未変更なら再描画スキップ（展開状態を壊さない）
  const hash = JSON.stringify(completed.map(r => [r.job_id, r.status, r.net_profit, r.trades]));
  if (hash === lastResultsHash) return;
  lastResultsHash = hash;

  // 最新10件に制限
  const recent = completed.slice(0, 10);
  const headerLabel = completed.length > 10
    ? `完了済みジョブ（最新10件 / 全${completed.length}件）`
    : `完了済みジョブ（${completed.length}件）`;

  el.innerHTML = `
    <div class="text-xs text-slate-400 mb-1 px-1">${headerLabel}</div>
    <div class="card overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase">
            <th class="px-4 py-3 text-left">ジョブID</th>
            <th class="px-4 py-3 text-left">タイプ</th>
            <th class="px-4 py-3 text-right">損益</th>
            <th class="px-4 py-3 text-right">WR</th>
            <th class="px-4 py-3 text-right">PF</th>
            <th class="px-4 py-3 text-right">DD</th>
            <th class="px-4 py-3 text-right">Sharpe</th>
            <th class="px-4 py-3 text-right">月間+</th>
            <th class="px-4 py-3 text-right">トレード</th>
            <th class="px-4 py-3 text-right">時間</th>
            <th class="px-4 py-3 text-right">状態</th>
          </tr>
        </thead>
        <tbody>
          ${recent.map(r => renderResultRow(r)).join('')}
        </tbody>
      </table>
    </div>
  `;

  // 展開状態を復元 + クリックハンドラ登録
  document.querySelectorAll('.expand-btn').forEach(btn => {
    const targetId = btn.dataset.target;
    // 前回展開していた行を復元
    if (expandedDetails.has(targetId)) {
      const target = document.getElementById(targetId);
      if (target) {
        target.classList.remove('hidden');
        btn.textContent = '▼';
      }
    }
    btn.addEventListener('click', () => {
      const target = document.getElementById(targetId);
      if (target) {
        target.classList.toggle('hidden');
        const isHidden = target.classList.contains('hidden');
        btn.textContent = isHidden ? '▶' : '▼';
        // 展開状態を記憶
        if (isHidden) {
          expandedDetails.delete(targetId);
        } else {
          expandedDetails.add(targetId);
        }
      }
    });
  });
}

function renderResultRow(r) {
  const statusCls = r.status === 'completed' ? 'text-green-400'
    : r.status === 'failed' ? 'text-red-400' : 'text-yellow-400';
  const statusLabel = r.status === 'completed' ? '完了'
    : r.status === 'failed' ? '失敗' : 'キャンセル';

  const hasPairs = r.pair_details && r.pair_details.length > 0;
  const hasYearly = r.yearly_details && r.yearly_details.length > 0;
  const cm = r.portfolio_metrics?.compound_metrics || null;
  const jc = r.job_config || null;
  const hasOverrides = jc?.overrides && Object.keys(jc.overrides).length > 0;
  const hasDetail = hasPairs || hasYearly || cm || jc;
  const detailId = 'detail-' + (r.job_id || '').replace(/[^a-zA-Z0-9]/g, '_');

  // ジョブIDセル: 7桁IDのみ
  const idLabel = r.job_id || '-';

  // 損益セル: 通常BT + compound
  let profitCell = fmtProfit(r.net_profit);
  if (cm) {
    profitCell += `<div class="text-xs mt-0.5">${fmtProfitK(cm.net_profit)} <span class="text-purple-400">複利</span></div>`;
  }

  // タイプセル: compound バッジ
  let typeCell = r.job_type === 'multi_pair' ? 'マルチ' : 'シングル';
  if (cm) {
    typeCell += ' <span class="text-xs px-1.5 py-0.5 bg-purple-900/60 text-purple-300 rounded">複利</span>';
  }

  let row = `
    <tr class="border-b border-slate-800 hover:bg-slate-800/50">
      <td class="px-4 py-3 font-medium text-white">
        ${hasDetail ? `<button class="expand-btn mr-1 text-slate-500 hover:text-white" data-target="${detailId}">▶</button>` : ''}
        ${idLabel}
      </td>
      <td class="px-4 py-3 text-slate-400">${typeCell}</td>
      <td class="px-4 py-3 text-right">${profitCell}</td>
      <td class="px-4 py-3 text-right mono">${fmtPct(r.win_rate)}</td>
      <td class="px-4 py-3 text-right mono">${fmtNum(r.profit_factor, 2)}</td>
      <td class="px-4 py-3 text-right mono">${fmtPct(r.max_drawdown)}</td>
      <td class="px-4 py-3 text-right mono">${fmtNum(r.sharpe_ratio, 2)}</td>
      <td class="px-4 py-3 text-right mono">${fmtPct(r.monthly_plus_rate)}</td>
      <td class="px-4 py-3 text-right mono">${fmtNum(r.trades)}</td>
      <td class="px-4 py-3 text-right mono text-slate-400">${fmtElapsed(r.elapsed_seconds)}</td>
      <td class="px-4 py-3 text-right"><span class="${statusCls} text-xs font-medium">${statusLabel}</span></td>
    </tr>
  `;

  if (hasDetail) {
    row += `
      <tr id="${detailId}" class="hidden">
        <td colspan="11" class="px-4 py-2 bg-slate-900/50">
          ${jc ? renderJobConfig(jc, r) : ''}
          ${hasYearly ? renderYearlyDetails(r.yearly_details) : ''}
          ${hasPairs ? renderPairDetails(r.pair_details) : ''}
          ${cm ? renderCompoundSection(cm) : ''}
        </td>
      </tr>
    `;
  }

  return row;
}

function renderJobConfig(jc, r) {
  // 通貨ペア・期間・descriptionは常に表示
  const symbol = jc.symbol || (jc.symbols && jc.symbols.join(', ')) || r?.symbol || '-';
  const years = jc.years || r?.years || '-';
  const desc = jc.description || r?.description || '';

  let html = `
    <div class="mb-3">
      <div class="text-xs text-slate-400 font-semibold mb-1">Job Info</div>
      <div class="flex flex-wrap gap-x-6 gap-y-1 text-xs mb-1">
        <span><span class="text-slate-500">通貨ペア:</span> <span class="text-slate-200">${symbol}</span></span>
        <span><span class="text-slate-500">期間:</span> <span class="text-slate-200">${years}</span></span>
        ${desc ? `<span><span class="text-slate-500">説明:</span> <span class="text-slate-200">${desc}</span></span>` : ''}
      </div>
  `;

  // overrides があれば追加表示
  const ov = jc.overrides || {};
  const sections = Object.entries(ov).filter(([, v]) => v && Object.keys(v).length > 0);
  if (sections.length > 0) {
    const rows = sections.map(([section, params]) => {
      const paramRows = Object.entries(params).map(([k, v]) =>
        `<span class="text-slate-400">${k}:</span> <span class="text-slate-200">${v}</span>`
      ).join(', ');
      return `<tr class="border-b border-slate-800/50"><td class="px-3 py-1 text-slate-500 font-medium">${section}</td><td class="px-3 py-1 text-slate-300 text-xs">${paramRows}</td></tr>`;
    }).join('');
    html += `<table class="w-full text-xs">${rows}</table>`;
  }

  html += '</div>';
  return html;
}

function renderYearlyDetails(years) {
  return `
    <div class="mb-3">
      <div class="text-xs text-slate-400 font-semibold mb-1">年別</div>
      <table class="w-full text-xs">
        <thead>
          <tr class="text-slate-500">
            <th class="px-3 py-1 text-left">年</th>
            <th class="px-3 py-1 text-right">損益</th>
            <th class="px-3 py-1 text-right">WR</th>
            <th class="px-3 py-1 text-right">PF</th>
            <th class="px-3 py-1 text-right">DD</th>
            <th class="px-3 py-1 text-right">Sharpe</th>
            <th class="px-3 py-1 text-right">月間+</th>
            <th class="px-3 py-1 text-right">トレード</th>
          </tr>
        </thead>
        <tbody>
          ${years.map(y => `
            <tr class="border-b border-slate-800/50">
              <td class="px-3 py-1 mono text-slate-300">${y.year || '-'}</td>
              <td class="px-3 py-1 text-right">${fmtProfit(y.net_profit)}</td>
              <td class="px-3 py-1 text-right mono">${fmtPct(y.win_rate)}</td>
              <td class="px-3 py-1 text-right mono">${fmtNum(y.profit_factor, 2)}</td>
              <td class="px-3 py-1 text-right mono">${fmtPct(y.max_drawdown)}</td>
              <td class="px-3 py-1 text-right mono">${fmtNum(y.sharpe_ratio, 2)}</td>
              <td class="px-3 py-1 text-right mono">${fmtPct(y.monthly_plus_rate)}</td>
              <td class="px-3 py-1 text-right mono">${fmtNum(y.trades)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderPairDetails(pairs) {
  return `
    <div class="mb-3">
      <div class="text-xs text-slate-400 font-semibold mb-1">ペア別（通常BT）</div>
      <table class="w-full text-xs">
        <thead>
          <tr class="text-slate-500">
            <th class="px-3 py-1 text-left">ペア</th>
            <th class="px-3 py-1 text-right">損益</th>
            <th class="px-3 py-1 text-right">WR</th>
            <th class="px-3 py-1 text-right">PF</th>
            <th class="px-3 py-1 text-right">トレード</th>
            <th class="px-3 py-1 text-right">寄与%</th>
          </tr>
        </thead>
        <tbody>
          ${pairs.map(p => `
            <tr class="border-b border-slate-800/50">
              <td class="px-3 py-1 mono text-slate-300">${p.symbol || '-'}</td>
              <td class="px-3 py-1 text-right">${fmtProfit(p.net_profit)}</td>
              <td class="px-3 py-1 text-right mono">${fmtPct(p.win_rate)}</td>
              <td class="px-3 py-1 text-right mono">${fmtNum(p.profit_factor, 2)}</td>

        </tbody>
      </table>
    </div>
  `;
}

// ジョブ設定からハッシュ生成（バックエンドの_compute_job_hashと同じロジック）
async function computeJobHash(j) {
  const keyFields = {
    type: j.type || 'single',
    symbol: j.symbol || 'USDJPY',
    symbols: (j.symbols || []).slice().sort(),
    years: j.years || '2023-2025',
    overrides: j.overrides || {},
    multi_pair_config: j.multi_pair_config || {},
    compound_replay: j.compound_replay || false,
  };
  const raw = JSON.stringify(keyFields, Object.keys(keyFields).sort());
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 8);
}

async function renderQueue(queueData, completedIds) {
  const el = document.getElementById('queue-list');
  const jobs = queueData?.jobs || [];
  if (jobs.length === 0) {
    el.innerHTML = '<div class="card px-5 py-4 text-slate-500 text-sm">キューなし</div>';
    return;
  }

  const doneSet = new Set(completedIds || []);

  // 各ジョブのIDを解決（id指定 or ハッシュ自動生成）
  const resolved = await Promise.all(jobs.map(async j => {
    const resolvedId = j.id || await computeJobHash(j);
    return { ...j, _resolvedId: resolvedId };
  }));

  el.innerHTML = `
    <div class="card px-5 py-3">
      <div class="space-y-1">
        ${resolved.map(j => {
          const done = doneSet.has(j._resolvedId);
          const icon = done ? '✓' : '○';
          const cls = done ? 'text-green-500' : 'text-slate-500';
          const textCls = done ? 'text-slate-500 line-through' : 'text-slate-300';
          const label = j.description || j.symbol || j._resolvedId;
          const idTag = `<span class="text-slate-600 text-xs">${j._resolvedId}</span>`;
          return `
            <div class="flex items-center gap-3 py-1 text-sm">
              <span class="${cls} text-base">${icon}</span>
              <span class="font-medium ${textCls}">${label}</span>
              ${idTag}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function updateHeader(status) {
  const statusEl = document.getElementById('runner-status');
  const cpuEl = document.getElementById('cpu-usage');

  if (!status || !status.updated_at) {
    statusEl.innerHTML = '<span class="text-yellow-400">未接続（ランナー起動待ち）</span>';
    cpuEl.textContent = '';
    return;
  }

  const lastUpdate = new Date(status.updated_at).getTime();
  const stale = (Date.now() - lastUpdate) > 15000;

  if (stale) {
    statusEl.innerHTML = '<span class="text-yellow-400">応答なし（最終更新: ' +
      new Date(status.updated_at).toLocaleTimeString('ja-JP') + '）</span>';
  } else if (status.paused) {
    statusEl.innerHTML = '<span class="text-yellow-400">⏸ 一時停止</span>';
  } else {
    statusEl.innerHTML = '<span class="text-green-400">● 稼働中</span>';
  }

  const tasks = status.running_tasks || [];
  const usedTasks = tasks.length;
  const cpuLoad = tasks.reduce((sum, t) => sum + (t.cpu_cost || 1.0), 0);
  const loadStr = Number.isInteger(cpuLoad) ? cpuLoad : cpuLoad.toFixed(1);
  cpuEl.textContent = `ワーカー: ${usedTasks} | CPU: ${loadStr} / ${status.cpu_threads || '?'}`;

  const cpuInput = document.getElementById('cpu-input');
  if (cpuInput && document.activeElement !== cpuInput && status.cpu_threads) {
    cpuInput.value = status.cpu_threads;
  }
}

// ===================================================================
// ポーリング
// ===================================================================

async function pollStatus() {
  try {
    const res = await fetch(API + '/api/status');
    lastStatus = await res.json();
    updateHeader(lastStatus);
    renderRunningJobs(lastStatus);
  } catch(e) {
    updateHeader(null);
  }
}

async function pollResults() {
  try {
    const [resResults, resQueue] = await Promise.all([
      fetch(API + '/api/results'),
      fetch(API + '/api/queue'),
    ]);
    lastResults = await resResults.json();
    const queueData = await resQueue.json();
    renderCompletedJobs(lastResults);
    await renderQueue(queueData, lastStatus?.completed_ids || []);
  } catch(e) {
    // 無視
  }
}

// 初回ロード
pollStatus();
pollResults();

// ポーリング
setInterval(pollStatus, 5000);
setInterval(pollResults, 15000);

// 経過時間リアルタイム更新
setInterval(() => {
  if (lastStatus?.job_progress?.length > 0) {
    renderRunningJobs(lastStatus);
  }
}, 1000);
</script>
