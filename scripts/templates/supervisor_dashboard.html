<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Supervisor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{}}}</script>
<style>
  body { font-family: 'Segoe UI', 'Meiryo', sans-serif; }
  .pulse-dot { animation: pulse 2s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .btn { @apply px-3 py-1.5 rounded text-sm font-medium transition-colors duration-150; }
  .btn-blue { @apply bg-blue-600 hover:bg-blue-500 text-white; }
  .btn-red { @apply bg-red-600 hover:bg-red-500 text-white; }
  .btn-green { @apply bg-green-600 hover:bg-green-500 text-white; }
  .btn-yellow { @apply bg-yellow-600 hover:bg-yellow-500 text-white; }
  .btn-gray { @apply bg-gray-600 hover:bg-gray-500 text-white; }
  .btn:disabled { @apply opacity-50 cursor-not-allowed; }
</style>
</head>
<body class="dark bg-gray-950 text-gray-100 min-h-screen">

<div class="max-w-4xl mx-auto px-4 py-6">
  <!-- ヘッダー -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <h1 class="text-2xl font-bold text-white">Process Supervisor</h1>
      <span id="sv-status" class="flex items-center gap-1.5 text-sm">
        <span class="w-2.5 h-2.5 rounded-full bg-green-400 pulse-dot"></span>
        <span class="text-green-400">稼働中</span>
      </span>
    </div>
    <div id="sv-uptime" class="text-sm text-gray-400"></div>
  </div>

  <!-- Git Status -->
  <div class="bg-gray-900 rounded-xl border border-gray-800 p-5 mb-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Git Status</h2>
      <div class="flex items-center gap-2">
        <span id="auto-pull-badge" class="text-xs px-2 py-0.5 rounded-full bg-green-900 text-green-300">Auto-pull: ON</span>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
      <div>
        <div class="text-xs text-gray-500 mb-1">Local</div>
        <div class="flex items-center gap-2">
          <code id="git-local-hash" class="text-blue-400 font-mono text-sm">---</code>
          <span id="git-local-msg" class="text-gray-300 text-sm truncate"></span>
        </div>
        <div id="git-local-date" class="text-xs text-gray-500 mt-0.5"></div>
      </div>
      <div>
        <div class="text-xs text-gray-500 mb-1">Remote (origin/main)</div>
        <div class="flex items-center gap-2">
          <code id="git-remote-hash" class="text-blue-400 font-mono text-sm">---</code>
          <span id="git-remote-msg" class="text-gray-300 text-sm truncate"></span>
          <span id="git-update-badge" class="hidden text-xs px-2 py-0.5 rounded-full bg-yellow-900 text-yellow-300">新しいコミットあり</span>
        </div>
        <div id="git-remote-date" class="text-xs text-gray-500 mt-0.5"></div>
      </div>
    </div>
    <div class="flex items-center justify-between">
      <span id="git-last-fetch" class="text-xs text-gray-500"></span>
      <div class="flex gap-2">
        <button onclick="checkUpdates()" class="btn btn-gray">Check Now</button>
        <button onclick="pullRestart()" id="btn-pull" class="btn btn-yellow">Pull &amp; Restart</button>
      </div>
    </div>
    <div id="git-error" class="hidden mt-2 text-xs text-red-400"></div>
  </div>

  <!-- Managed Processes -->
  <div class="bg-gray-900 rounded-xl border border-gray-800 p-5 mb-5">
    <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-4">Managed Processes</h2>
    <div id="process-list" class="space-y-3">
      <!-- プロセスカードはJSで動的生成 -->
    </div>
  </div>

  <!-- Event Log -->
  <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
    <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Event Log</h2>
    <div id="event-log" class="space-y-1 max-h-64 overflow-y-auto font-mono text-xs">
      <div class="text-gray-500">読み込み中...</div>
    </div>
  </div>
</div>

<script>
const API = '';
let lastStatus = null;

// ステータスの色マッピング
const STATUS_COLORS = {
  running:  { dot: 'bg-green-400', text: 'text-green-400', label: '稼働中' },
  stopped:  { dot: 'bg-gray-500',  text: 'text-gray-400',  label: '停止中' },
  stopping: { dot: 'bg-yellow-400 pulse-dot', text: 'text-yellow-400', label: '停止処理中...' },
};

// イベントタイプの色
const EVENT_COLORS = {
  started: 'text-green-400',
  stopped: 'text-blue-400',
  crashed: 'text-red-400',
  error: 'text-red-400',
  pull_failed: 'text-red-400',
  force_killed: 'text-orange-400',
  update_detected: 'text-yellow-400',
  pull_start: 'text-yellow-400',
  pull_success: 'text-green-400',
  pull_restart_complete: 'text-green-400',
  rollback: 'text-orange-400',
  supervisor_start: 'text-blue-400',
  discovered: 'text-blue-400',
};

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderProcessCard(name, p) {
  const sc = STATUS_COLORS[p.status] || STATUS_COLORS.stopped;
  const portStr = p.port ? ` :${p.port}` : '';
  const uptimeStr = p.uptime ? ` ${p.uptime}` : '';
  const restartStr = p.restart_count > 0 ? ` 再起動:${p.restart_count}回` : '';
  const autoTag = p.restart_on_update
    ? '<span class="text-xs px-1.5 py-0.5 rounded bg-green-900/50 text-green-400">auto-update</span>'
    : '<span class="text-xs px-1.5 py-0.5 rounded bg-gray-800 text-gray-500">manual</span>';

  let buttons = '';
  if (p.status === 'running') {
    buttons = `
      <button onclick="stopProc('${name}')" class="btn btn-red text-xs">Stop</button>
      <button onclick="restartProc('${name}')" class="btn btn-blue text-xs">Restart</button>
    `;
  } else if (p.status === 'stopped') {
    buttons = `<button onclick="startProc('${name}')" class="btn btn-green text-xs">Start</button>`;
  } else {
    buttons = `<button disabled class="btn btn-gray text-xs">処理中...</button>`;
  }

  return `
    <div class="flex items-center justify-between p-3 rounded-lg bg-gray-800/50 border border-gray-700/50">
      <div class="flex items-center gap-3">
        <span class="w-2.5 h-2.5 rounded-full ${sc.dot}"></span>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-medium text-white">${escHtml(p.label)}</span>
            ${autoTag}
          </div>
          <div class="text-xs text-gray-500 mt-0.5">
            ${p.pid ? 'PID:' + p.pid : ''}${portStr}${uptimeStr}${restartStr}
          </div>
        </div>
      </div>
      <div class="flex gap-2">${buttons}</div>
    </div>
  `;
}

function renderEvents(events) {
  if (!events || events.length === 0) {
    return '<div class="text-gray-500">イベントなし</div>';
  }
  return events.map(e => {
    const color = EVENT_COLORS[e.type] || 'text-gray-400';
    return `<div class="flex gap-3">
      <span class="text-gray-500 shrink-0">${escHtml(e.time)}</span>
      <span class="${color} shrink-0">${escHtml(e.type)}</span>
      <span class="text-gray-300 truncate">${escHtml(e.message)}</span>
    </div>`;
  }).join('');
}

async function fetchStatus() {
  try {
    const [statusRes, eventsRes] = await Promise.all([
      fetch(API + '/api/status'),
      fetch(API + '/api/events'),
    ]);
    const status = await statusRes.json();
    const events = await eventsRes.json();
    lastStatus = status;

    // Supervisor
    document.getElementById('sv-uptime').textContent = 'uptime: ' + (status.supervisor?.uptime || '---');

    // Git
    const g = status.git || {};
    document.getElementById('git-local-hash').textContent = g.local_hash || '---';
    document.getElementById('git-local-msg').textContent = g.local_message || '';
    document.getElementById('git-local-date').textContent = g.local_date || '';
    document.getElementById('git-remote-hash').textContent = g.remote_hash || '---';
    document.getElementById('git-remote-msg').textContent = g.remote_message || '';
    document.getElementById('git-remote-date').textContent = g.remote_date || '';
    document.getElementById('git-last-fetch').textContent = g.last_fetch ? 'Last fetch: ' + g.last_fetch : '';

    const badge = document.getElementById('git-update-badge');
    if (g.has_update) {
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }

    const errEl = document.getElementById('git-error');
    if (g.last_error) {
      errEl.textContent = g.last_error;
      errEl.classList.remove('hidden');
    } else {
      errEl.classList.add('hidden');
    }

    // Processes
    const procList = document.getElementById('process-list');
    const procs = status.processes || {};
    procList.innerHTML = Object.entries(procs).map(([n, p]) => renderProcessCard(n, p)).join('');

    // Events
    document.getElementById('event-log').innerHTML = renderEvents(events);
  } catch (err) {
    console.error('Status fetch error:', err);
  }
}

async function apiPost(url) {
  try {
    const res = await fetch(API + url, { method: 'POST' });
    return await res.json();
  } catch (err) {
    console.error('API error:', err);
    return { ok: false };
  }
}

async function startProc(name) { await apiPost(`/api/process/${name}/start`); fetchStatus(); }
async function stopProc(name) { await apiPost(`/api/process/${name}/stop`); fetchStatus(); }
async function restartProc(name) { await apiPost(`/api/process/${name}/restart`); fetchStatus(); }
async function checkUpdates() { await apiPost('/api/check-updates'); fetchStatus(); }
async function pullRestart() {
  if (!confirm('origin/mainからpullして対象プロセスを再起動しますか？')) return;
  await apiPost('/api/pull-restart');
  fetchStatus();
}

// 初回読み込み + 3秒間隔ポーリング
fetchStatus();
setInterval(fetchStatus, 3000);
</script>
</body>
</html>
