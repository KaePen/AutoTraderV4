# 通貨ペア別取引パラメータプリセット
# defaults: 全シンボル共通フォールバック
# symbols[X]: 個別シンボル設定（defaultsを上書き）

defaults:
  pip_value: 100.0
  spread_pips: 1.5
  slippage_pips: 0.5
  default_sl_pips: 20.0
  default_tp_pips: 40.0
  min_lot: 0.01
  max_lot: 10.0
  commission_per_lot: 0.0
  max_positions: 2
  bonus_max_positions: 1
  bonus_score_threshold: 7.0
  base_risk_pct: 0.02
  max_lot_per_trade: 2.0
  max_total_exposure_lot: 5.0
  equity_floor_pct: 0.30

# ------------------------------------------------------------------
# USD ペア（quote currency = USD: pip_value ≈ $10/lot）
# ------------------------------------------------------------------
symbols:
  EURUSD:
    pip_value: 10.0        # EUR/USD 1pip=$0.0001×100,000=$10
    spread_pips: 1.0
    slippage_pips: 0.3
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    max_positions: 2
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 2.0

  GBPUSD:
    pip_value: 10.0        # GBP/USD 1pip=$10/lot
    spread_pips: 1.5
    slippage_pips: 0.3
    default_sl_pips: 20.0  # GBPは値動きが大きめ
    default_tp_pips: 40.0
    max_positions: 2
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 2.0

  AUDUSD:
    pip_value: 10.0        # AUD/USD 1pip=$10/lot
    spread_pips: 1.5
    slippage_pips: 0.3
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    max_positions: 2
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 2.0

  NZDUSD:
    pip_value: 10.0        # NZD/USD 1pip=$10/lot
    spread_pips: 2.0       # NZDは流動性やや低め
    slippage_pips: 0.5
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    max_positions: 2
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 1.5

  USDCHF:
    pip_value: 9.0         # 1pip=10CHF/lot、CHF≈1.1USD → ~$9.1
    spread_pips: 1.5
    slippage_pips: 0.3
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    max_positions: 2
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 2.0

  USDCAD:
    pip_value: 7.5         # 1pip=10CAD/lot、CAD≈0.75USD → ~$7.3
    spread_pips: 2.0
    slippage_pips: 0.5
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    max_positions: 2
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 2.0

# ------------------------------------------------------------------
# JPY ペア（quote currency = JPY: pip_value=100）
# ------------------------------------------------------------------

  USDJPY:
    pip_value: 100.0       # USD/JPY 1pip=0.01×100,000=1000JPY（標準口座）
    spread_pips: 1.5
    slippage_pips: 0.5
    default_sl_pips: 20.0
    default_tp_pips: 40.0
    max_positions: 2
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 2.0

  EURJPY:
    pip_value: 100.0
    spread_pips: 2.0
    slippage_pips: 0.7
    default_sl_pips: 25.0
    default_tp_pips: 50.0
    max_positions: 2
    bonus_score_threshold: 7.5
    base_risk_pct: 0.02
    max_lot_per_trade: 1.5

  GBPJPY:
    pip_value: 100.0
    spread_pips: 3.0       # GBP/JPYはスプレッドが広め
    slippage_pips: 1.0
    default_sl_pips: 30.0
    default_tp_pips: 60.0
    max_positions: 1
    bonus_max_positions: 1
    bonus_score_threshold: 8.0
    base_risk_pct: 0.015
    max_lot_per_trade: 1.0

  AUDJPY:
    pip_value: 100.0
    spread_pips: 2.0
    slippage_pips: 0.7
    default_sl_pips: 20.0
    default_tp_pips: 40.0
    max_positions: 2
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 1.5

  CADJPY:
    pip_value: 100.0
    spread_pips: 2.5
    slippage_pips: 0.7
    default_sl_pips: 20.0
    default_tp_pips: 40.0
    max_positions: 2
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 1.5

  CHFJPY:
    pip_value: 100.0
    spread_pips: 2.5
    slippage_pips: 0.7
    default_sl_pips: 25.0
    default_tp_pips: 50.0
    max_positions: 2
    bonus_score_threshold: 7.5
    base_risk_pct: 0.02
    max_lot_per_trade: 1.5
