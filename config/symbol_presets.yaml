# 通貨ペア別取引パラメータプリセット
# defaults: 全シンボル共通フォールバック（SSOT）
# symbols[X]: 個別シンボル設定（defaultsを上書き）
#
# 構造:
#   defaults/symbols[X] 直下 = SymbolPreset フィールド（通貨ペア固有）
#   signal:     = SignalConfig（シグナル生成・コンセンサス）
#   risk_mgmt:  = RiskManagementConfig（SL/TP・資金管理）
#   filter:     = FilterConfig（レジーム・時間帯フィルター）
#
# live_trading.yaml は廃止予定。全設定はこのファイルで管理する。

# --- シグナル生成設定（全通貨ペア共通デフォルト）---
signal:
  consensus_threshold: 9.0            # 単独BT用
  multi_consensus_threshold: 9.5      # マルチBT・ライブ用
  consensus_primary_weight: 2.0
  consensus_entry_weight: 1.5
  consensus_confirm_weight: 3.0
  consensus_manage_weight: 0.5
  consensus_other_weight: 1.0
  bca_enabled: true
  bca_min_edge: 0.60
  bca_penalty_scale: 1.0
  htf_score_filter_enabled: true
  htf_score_filter_min_alignment: 0.1
  htf_score_filter_threshold_add: 1.0
  macd_slope_filter_threshold: -2.0
  trend_strength_max: 0.7

# --- リスク管理設定（全通貨ペア共通デフォルト）---
risk_mgmt:
  sl_min_pips: 20.0
  sl_max_pips_default: 50.0
  penalty_cap: 0.3
  default_tp_sl_ratio_range: [1.1, 1.4]
  use_dynamic_lot: true
  slippage_buffer_pips: 2.0

# --- フィルター設定（全通貨ペア共通デフォルト）---
filter:
  range_day_bbw_threshold: 0.25
  range_day_score_premium: 0.3
  weak_hours_enabled: true
  weak_hours_score_premium: 0.5
  sg_spread_penalty_rate: 0.2
  sg_off_hours_penalty: 0.25
  sg_volatility_penalty: 0.05
  sg_recent_loss_penalty: 0.1
  regime_threshold_enabled: true
  regime_trend_threshold_add: 1.5

# --- PM設定（全通貨ペア共通デフォルト）---
pm_config:
  partial_close_1r_ratio: 0.05
  partial_close_2r_ratio: 0.05
  breakeven_at_1r: true
  trailing_start_r: 0.5
  trailing_atr_multiplier: 2.0
  early_breakeven_r: 0.3
  signal_rev_close_ratio: 0.0
  range_day_be_disabled: true
  range_day_early_be_r: 0.3
  range_day_fast_be_enabled: true
  range_day_fast_be_minutes: 90.0
  stagnation_exit_minutes: 120.0
  stagnation_min_mfe_r: 0.10
  be_cushion_pips: 3.0
  range_day_insurance_enabled: false   # Exit簡素化でOFF
  insurance_trigger_r: 1.0
  insurance_block_high_mfe_r: 0.8
  insurance_min_holding_minutes: 15.0
  range_day_half_r_partial_enabled: false  # Exit簡素化でOFF
  range_day_half_r_partial_ratio: 0.20
  range_day_half_r_trigger: 0.5
  # デュアルトラック: 怪しいトレードの早期利確
  early_profit_guard_enabled: true
  stag_pretighten_enabled: true

# --- 通貨ペア別プリセット ---
defaults:
  pip_unit: 0.01          # JPYペア: 1pip = 0.01
  # quote_ccy_rate: クォート通貨→口座通貨(JPY)変換レート
  # JPYペアは1.0固定。非JPYペアは概算値（将来: バックテスト中に動的取得予定）
  quote_ccy_rate: 1.0
  pip_value: 100.0
  spread_pips: 1.5
  slippage_pips: 0.5
  default_sl_pips: 20.0
  default_tp_pips: 40.0
  min_lot: 0.01
  max_lot: 10.0
  commission_per_lot: 0.0
  max_positions: 1              # マルチペア運用: per_pair=1 に統一
  bonus_max_positions: 0        # 1ペア1ポジションなのでボーナス不要
  bonus_score_threshold: 7.0
  base_risk_pct: 0.015        # pip_value修正後DD対策: 0.025 → 0.015
  max_lot_per_trade: 1.5      # pip_value修正後DD対策: 2.5 → 1.5
  max_total_exposure_lot: 3.0 # pip_value修正後DD対策: 4.0 → 3.0
  equity_floor_pct: 0.30
  # トレーリングストップ設定（デフォルトON）
  use_position_manager: true
  trailing_start_r: 2.0
  trailing_atr_multiplier: 2.0
  breakeven_at_1r: true

# ------------------------------------------------------------------
# USD ペア（quote currency = USD: pip_value ≈ $10/lot）
# ------------------------------------------------------------------
symbols:
  EURUSD:
    pip_unit: 0.0001       # 非JPYペア: 1pip = 0.0001
    quote_ccy_rate: 150.0  # USD→JPY概算レート
    pip_value: 10.0        # EUR/USD 1pip=$0.0001×100,000=$10
    spread_pips: 1.0
    slippage_pips: 0.3
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    # EURUSD最適化結果 (2026-03-09, 2023-2025検証, pip_value修正後)
    # +18.6M, WR 75.5%, MaxDD 9.21%, Trades 3,844
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_score_threshold: 7.0
    base_risk_pct: 0.01
    max_lot_per_trade: 1.5
    max_total_exposure_lot: 3.0

  GBPUSD:
    pip_unit: 0.0001
    quote_ccy_rate: 150.0
    pip_value: 10.0        # GBP/USD 1pip=$10/lot
    spread_pips: 1.5
    slippage_pips: 0.3
    default_sl_pips: 20.0  # GBPは値動きが大きめ
    default_tp_pips: 40.0
    # GBPUSD最適化結果 (2026-03-09, 2023-2025検証, pip_value修正後)
    # +14.2M, WR 75.2%, MaxDD 7.33%, Trades 3,233
    max_positions: 1
    bonus_score_threshold: 7.0
    base_risk_pct: 0.01
    max_lot_per_trade: 1.5
    max_total_exposure_lot: 2.0
    # トレーリングストップ有効化
    use_position_manager: true
    trailing_start_r: 1.5
    trailing_atr_multiplier: 2.0
    breakeven_at_1r: true

  AUDUSD:
    pip_unit: 0.0001
    quote_ccy_rate: 150.0
    pip_value: 10.0        # AUD/USD 1pip=$10/lot
    spread_pips: 1.5
    slippage_pips: 0.3
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    # AUDUSD最適化結果 (2026-03-09, 2023-2025検証, pip_value修正後)
    # +9.7M, WR 72.8%, MaxDD 7.98%, Trades 3,214
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_score_threshold: 7.0
    base_risk_pct: 0.01
    max_lot_per_trade: 1.5
    max_total_exposure_lot: 3.0

  NZDUSD:
    pip_unit: 0.0001
    quote_ccy_rate: 150.0
    pip_value: 10.0        # NZD/USD 1pip=$10/lot
    spread_pips: 2.0       # NZDは流動性やや低め
    slippage_pips: 0.5
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    # NZDUSD最適化結果 (2026-03-09, 2023-2025検証, pip_value修正後)
    # +3.5M, WR 70.3%, MaxDD 7.29%, Trades 2,204
    max_positions: 1
    bonus_score_threshold: 7.0
    base_risk_pct: 0.01
    max_lot_per_trade: 1.5
    max_total_exposure_lot: 2.0

  USDCHF:
    pip_unit: 0.0001
    quote_ccy_rate: 170.0  # CHF→JPY概算レート
    pip_value: 9.0         # 1pip=10CHF/lot、CHF≈1.1USD → ~$9.1
    spread_pips: 1.5
    slippage_pips: 0.3
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 2.0

  USDCAD:
    pip_unit: 0.0001
    quote_ccy_rate: 110.0  # CAD→JPY概算レート
    pip_value: 7.5         # 1pip=10CAD/lot、CAD≈0.75USD → ~$7.3
    spread_pips: 2.0
    slippage_pips: 0.5
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 2.0

# ------------------------------------------------------------------
# JPY ペア（quote currency = JPY: pip_value=100）
# ------------------------------------------------------------------

  USDJPY:
    pip_value: 100.0       # USD/JPY 1pip=0.01×100,000=1000JPY（標準口座）
    spread_pips: 1.5
    slippage_pips: 0.5
    default_sl_pips: 20.0
    default_tp_pips: 40.0
    # USDJPY最適化結果 (2026-03-12, P2+P3+WI)
    # WI: TSM 0.85 -> +1,353K (+9.2%), WR +0.3pp
    # Tier 1 (WR 77%, PF 2.4)
    max_positions: 1
    bonus_max_positions: 0
    bonus_score_threshold: 7.0
    base_risk_pct: 0.02
    max_lot_per_trade: 2.0
    max_total_exposure_lot: 4.0
    equity_floor_pct: 0.30
    signal:
      trend_strength_max: 0.85    # WI: +1,353K, WR +0.3pp vs 0.7

  EURJPY:
    pip_value: 100.0
    spread_pips: 2.0
    slippage_pips: 0.7
    default_sl_pips: 25.0
    default_tp_pips: 50.0
    # EURJPY最適化結果 (2026-03-12, P2+P3+WI)
    # WI: PCAP 0.5 -> +764K (+4.5%), PF -0.04
    # Tier 1 (WR 75%, PF 2.1)
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_score_threshold: 7.5
    base_risk_pct: 0.02           # Tier 1: 2.0%
    max_lot_per_trade: 2.0        # Tier 1
    max_total_exposure_lot: 4.0   # Tier 1
    signal:
      bca_min_edge: 0.70
      volume_filter_enabled: true
      volume_filter_threshold: 1.0   # T2: Profit+330K, DD -0.31pp vs OFF
      volume_filter_penalty: 0.5
      penalty_cap: 0.5              # WI: +764K, WR -1.1pp, PF -0.04

  GBPJPY:
    pip_value: 100.0
    spread_pips: 3.0       # GBP/JPYはスプレッドが広め
    slippage_pips: 1.0
    default_sl_pips: 30.0
    default_tp_pips: 60.0
    # GBPJPY最適化結果 (2026-03-12, 2024-2025検証, P2+P3)
    # BCA 0.65→0.70 (DD -1.4pp), VF OFF（効果なし）
    # Tier 2: 標準ペア (WR 73-75%, PF 2.0前後)
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_max_positions: 0
    bonus_score_threshold: 8.0
    base_risk_pct: 0.015          # Tier 2: 1.5%
    max_lot_per_trade: 1.5        # Tier 2
    max_total_exposure_lot: 3.0   # Tier 2
    signal:
      bca_min_edge: 0.70  # P2結果: 0.70が最良 (DD -1.4pp vs 0.65)
      volume_filter_enabled: false  # P3結果: VF効果なし
      penalty_cap: 0.5              # IM-T9/T15: +6.0%(6Y), WR -0.9pp, DD 5.52%

  AUDJPY:
    pip_value: 100.0
    spread_pips: 2.0
    slippage_pips: 0.7
    default_sl_pips: 20.0
    default_tp_pips: 40.0
    # AUDJPY最適化結果 (2026-03-12, P2+P3+WI)
    # WI: PCAP 0.5 -> +2,054K (+22.3%), PF +0.03
    # Tier 2
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_score_threshold: 7.0
    base_risk_pct: 0.015          # Tier 2: 1.5% (旧0.012)
    max_lot_per_trade: 1.5        # Tier 2
    max_total_exposure_lot: 3.0   # Tier 2
