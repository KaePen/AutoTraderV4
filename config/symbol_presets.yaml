    slippage_pips: 0.7
    default_sl_pips: 25.0
    default_tp_pips: 50.0
    # CHFJPY最適化結果 (2026-03-12, P2+P3+WI)
    # WI: PCAP 0.5 -> +2,918K (+34.6%), PF +0.05
    # Tier 2
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_score_threshold: 7.5
    base_risk_pct: 0.015          # Tier 2: 1.5%
    max_lot_per_trade: 1.5        # Tier 2
    max_total_exposure_lot: 3.0   # Tier 2
    signal:
      bca_min_edge: 0.70  # P2結果: 0.70が最良 (Sharpe +0.71 vs 0.60)
      penalty_cap: 0.5              # WI: +2,918K, WR +0.2pp, PF +0.05

# --- マルチ通貨ペア ポートフォリオ設定 ---
# ポートフォリオ制約のみ（base_risk_pct/consensus_threshold は個別プリセットの責務）
multi_pair:
  global_max_positions: 6
  per_pair_max_positions: 1
  global_max_exposure_lot: 10.0
