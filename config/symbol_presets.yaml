    bonus_score_threshold: 7.5
    base_risk_pct: 0.006          # ストレステストP3結果: 0.6%採用 (旧0.005)
    max_lot_per_trade: 2.0
    max_total_exposure_lot: 4.0
    signal:
      bca_min_edge: 0.70
      volume_filter_enabled: true
      volume_filter_threshold: 1.0   # T2: Profit+330K, DD -0.31pp vs OFF
      volume_filter_penalty: 0.5

      regime_trend_threshold_add: 2.0  # RL-T: TREND DD圧縮
    filter:
      penalty_cap: 0.5              # WI: +764K, WR -1.1pp, PF -0.04

  GBPJPY:
    pip_value: 100.0
    spread_pips: 3.0       # GBP/JPYはスプレッドが広め
    sg_spread_threshold_pips: 5.5  # p95ベース (2023-2025 p95=5.4)
    slippage_pips: 1.0
    default_sl_pips: 30.0
    default_tp_pips: 60.0
    # GBPJPY最適化結果 (2026-03-13, RL-T Round 5)
    # CS12+M1MR+RTT2.0: WR 75.02%, 3,274 trades, PF 2.31, DD 3.83%
    # Tier 2 (WR 75%, PF 2.3)
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_max_positions: 0
    bonus_score_threshold: 8.0
    base_risk_pct: 0.006          # ストレステストP3結果: 0.6%採用 (旧0.005)
    max_lot_per_trade: 1.5
    max_total_exposure_lot: 3.0
    signal:
      bca_min_edge: 0.70  # P2結果: 0.70が最良 (DD -1.4pp vs 0.65)
      volume_filter_enabled: false  # P3結果: VF効果なし
      trend_strength_max: 0.85       # IM-T30: +9.9%(6Y), DD 5.27%
      m1_micro_reversal_enabled: true  # RL-T20: +450K, WR +0.36pp, DD -0.30pp

      regime_trend_threshold_add: 2.0  # RL-T: TREND DD圧縮
    filter:
      penalty_cap: 0.5              # IM-T9/T15: +6.0%(6Y), WR -0.9pp, DD 5.52%

  AUDJPY:
    pip_value: 100.0
    spread_pips: 2.0
    sg_spread_threshold_pips: 4.5  # p95ベース (2023-2025 p95=4.3)
    slippage_pips: 0.7
    default_sl_pips: 20.0
    default_tp_pips: 40.0
    # AUDJPY最適化結果 (2026-03-13, RL-T Round 5)
    # CS12+RTT2.0: WR 72.95%, 2,532 trades, PF 2.20, DD 4.30%
    # Tier 2 (WR 73%, PF 2.2)
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_score_threshold: 7.0
    base_risk_pct: 0.006          # ストレステストP3結果: 0.6%採用 (旧0.005)
    max_lot_per_trade: 1.5
    max_total_exposure_lot: 3.0
    signal:
      bca_min_edge: 0.65  # P2結果: 0.65が最良 (PF +0.079 vs 0.55)
      volume_filter_enabled: true
      volume_filter_threshold: 1.0   # T2: Profit+80K, Sharpe +0.18 vs OFF
      volume_filter_penalty: 0.5
      trend_strength_max: 0.85       # IM-T32: +4.6%(6Y), DD 4.20%

      regime_trend_threshold_add: 2.0  # RL-T: TREND DD圧縮
    filter:
      penalty_cap: 0.5              # WI: +2,054K, WR -0.2pp, PF +0.03

  CADJPY:
    pip_value: 100.0
    spread_pips: 2.5
    sg_spread_threshold_pips: 5.5  # p95ベース (2023-2025 p95=5.4)
    slippage_pips: 0.7
    default_sl_pips: 20.0
    default_tp_pips: 40.0
    # CADJPY最適化結果 (2026-03-13, RL-T Round 5)
    # CS12+RTT2.0: WR 73.14%, 2,156 trades, PF 2.36, DD 4.29%
    # Tier 2 (WR 73%, PF 2.4)
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_score_threshold: 7.0
    base_risk_pct: 0.006          # ストレステストP3結果: 0.6%採用 (旧0.005)
    max_lot_per_trade: 1.5
