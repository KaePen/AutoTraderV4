      bca_min_edge: 0.65  # P2結果: 0.65が最良 (PF +0.079 vs 0.55)
      volume_filter_enabled: true
      volume_filter_threshold: 1.0   # T2: Profit+80K, Sharpe +0.18 vs OFF
      volume_filter_penalty: 0.5
      penalty_cap: 0.5              # WI: +2,054K, WR -0.2pp, PF +0.03

  CADJPY:
    pip_value: 100.0
    spread_pips: 2.5
    slippage_pips: 0.7
    default_sl_pips: 20.0
    default_tp_pips: 40.0
    # CADJPY最適化結果 (2026-03-12, 2024-2025検証, P2+P3)
    # BCA 0.65→0.70 (Sharpe +0.73), VF T2 (1.0/0.5) — Profit+220K, DD -1.61pp
    # Tier 2: 標準ペア — risk 0.012→0.015, lot 1.0→1.5に引き上げ
    max_positions: 1              # マルチペア運用: per_pair=1 に統一
    bonus_score_threshold: 7.0
    base_risk_pct: 0.015          # Tier 2: 1.5% (旧0.012)
    max_lot_per_trade: 1.5        # Tier 2 (旧1.0)
    max_total_exposure_lot: 3.0   # Tier 2 (旧2.0)
