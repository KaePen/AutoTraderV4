# 通貨ペア別プリセット設定
# ============================================================
# trading_defaults.yaml のグローバル値を通貨ペア別に上書きする。
# symbols[X] セクションのみ変更が必要な値を記載する。
# ============================================================

# --- グローバルシグナル設定 ---
signal:
  consensus_threshold: 14.0           # D1/CT14: WR67.1%(IS), 64.7%(OOS), trades 2.7x vs CT18

# --- 通貨ペア共通フォールバック（SymbolPreset フィールド）---
defaults:
  pip_unit: 0.01          # JPYペア: 1pip = 0.01
  # quote_ccy_rate: クォート通貨→口座通貨(JPY)変換レート
  # JPYペアは1.0固定。非JPYペアは概算値
  quote_ccy_rate: 1.0
  pip_value: 100.0
  spread_pips: 1.5
  slippage_pips: 0.5
  default_sl_pips: 20.0
  default_tp_pips: 40.0
  min_lot: 0.01
  max_lot: 10.0
  commission_per_lot: 0.0
  max_positions: 1
  bonus_max_positions: 0
  bonus_score_threshold: 7.0
  base_risk_pct: 0.004          # DD圧縮: 0.4%採用 (MP-T18系の保守設定、handover risk_philosophy)
  max_lot_per_trade: 1.5
  max_total_exposure_lot: 3.0
  equity_floor_pct: 0.30
  use_position_manager: true
  trailing_start_r: 0.5
  trailing_atr_multiplier: 2.0
  breakeven_at_1r: true
  sg_spread_threshold_pips: 4.5  # p95ベース切り上げ

# ------------------------------------------------------------------
# USD ペア（quote currency = USD: pip_value ≈ $10/lot）
# ------------------------------------------------------------------
symbols:
  EURUSD:
    pip_unit: 0.0001
    quote_ccy_rate: 150.0
    pip_value: 10.0
    spread_pips: 1.0
    sg_spread_threshold_pips: 2.5  # p95ベース (2023-2025 p95=2.2)
    slippage_pips: 0.3
    default_sl_pips: 15.0
    default_tp_pips: 30.0
    max_positions: 1
    bonus_score_threshold: 7.0
    base_risk_pct: 0.004        # DD圧縮: 0.4%統一 (旧0.01)
    max_lot_per_trade: 1.5
    max_total_exposure_lot: 3.0
    signal:
      macd_slope_deadzone_atr_ratio: 0.01  # DZ-T2: PF 4.22→4.86
    filter:
      regime_trend_threshold_add: 2.0

  GBPUSD:
    pip_unit: 0.0001
    quote_ccy_rate: 150.0
    pip_value: 10.0
    spread_pips: 1.5
    sg_spread_threshold_pips: 3.0  # p95ベース (2023-2025 p95=2.9)
    slippage_pips: 0.3
    default_sl_pips: 20.0
    default_tp_pips: 40.0
    max_positions: 1
    bonus_score_threshold: 7.0
    base_risk_pct: 0.004        # DD圧縮: 0.4%統一 (旧0.01)
    max_lot_per_trade: 1.5
    max_total_exposure_lot: 2.0
    use_position_manager: true
    signal:
      macd_slope_deadzone_atr_ratio: 0.01  # DZ-R4: PF 4.00→4.77
    filter:
      regime_trend_threshold_add: 2.0
    pm_config:
